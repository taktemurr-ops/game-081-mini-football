name: Flutter CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android and iOS project shells
        run: flutter create --platforms=android,ios .
      - name: Remove Flutter template test
        run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: game-081-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
